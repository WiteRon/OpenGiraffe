<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>我的环渤海湾浪漫手帐 · 3D 地球</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap">
  <!-- 自托管脚本。请务必通过 http://localhost:8000/mobile 打开本页（先运行后端） -->
  <script src="/static/js/globe.gl.min.js"></script>
  <style>
    :root {
      --primary-color: #d87093;
      --secondary-color: #ffb6c1;
      --background-color: #0a0a12;
      --text-color: #eee;
      --shadow-color: rgba(216, 112, 147, 0.25);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--background-color);
      color: var(--text-color);
    }
    .app-container { position: relative; width: 100%; height: 100%; min-height: 100vh; }
    #globeContainer {
      position: absolute;
      left: 0; top: 0; right: 0; bottom: 0;
      width: 100%; height: 100%;
      min-height: 100vh;
      background: #0a0a12;
    }
    .top-bar {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(20, 20, 30, 0.9);
      box-shadow: 0 4px 20px var(--shadow-color);
      z-index: 10;
    }
    .title { color: var(--primary-color); font-size: 18px; }
    .subtitle { font-size: 11px; color: #888; margin-top: 4px; }
    /* 信息面板：点击旗帜后展示 */
    .info-panel {
      position: absolute;
      top: 0; right: 0; bottom: 0;
      width: 100%;
      max-width: 340px;
      background: linear-gradient(to left, rgba(20,20,35,0.98), rgba(15,15,25,0.95));
      box-shadow: -8px 0 32px rgba(0,0,0,0.4);
      padding: 16px;
      overflow-y: auto;
      z-index: 20;
      transform: translateX(100%);
      transition: transform 0.35s ease;
    }
    .info-panel.open { transform: translateX(0); }
    .info-panel h2 { color: var(--primary-color); font-size: 20px; margin-bottom: 8px; }
    .info-panel .city-desc { font-size: 13px; color: #aaa; margin-bottom: 12px; line-height: 1.5; }
    .info-panel .days { display: flex; flex-direction: column; gap: 8px; }
    .day-card {
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 10px 12px;
      border-left: 3px solid var(--primary-color);
    }
    .day-card .date { font-size: 11px; color: #888; margin-bottom: 4px; }
    .day-card .desc { font-size: 13px; line-height: 1.45; }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .card-btn {
      border: 0;
      border-radius: 999px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      color: white;
      background: rgba(216, 112, 147, 0.85);
    }
    .card-btn.delete {
      background: rgba(182, 69, 69, 0.9);
    }
    .card-btn:disabled {
      opacity: 0.55;
      cursor: wait;
    }
    .btn-back {
      position: absolute;
      bottom: 20px; left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px;
      border-radius: 999px;
      border: none;
      background: var(--primary-color);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--shadow-color);
      z-index: 25;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .btn-back.visible { opacity: 1; pointer-events: auto; }
  </style>
</head>
<body>
  <div class="app-container">
    <div id="globeContainer"></div>
    <div class="top-bar">
      <div class="title">My Trip Diary · 3D 地球</div>
      <div class="subtitle">点击地球上的城市旗帜查看行程</div>
    </div>
    <div id="infoPanel" class="info-panel">
      <h2 id="panelCity">—</h2>
      <p id="panelCityDesc" class="city-desc">—</p>
      <div id="panelDays" class="days"></div>
    </div>
    <button type="button" id="btnBack" class="btn-back">返回地球</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      requestAnimationFrame(function () {
        initGlobe().catch(function (err) {
          console.error(err);
          var el = document.getElementById('globeContainer');
          el.innerHTML = '<p style="color:#f88;padding:20px;">加载失败: ' + (err.message || err) + '</p>';
        });
      });
    });

    async function initGlobe() {
      const container = document.getElementById('globeContainer');
      const infoPanel = document.getElementById('infoPanel');
      const backButton = document.getElementById('btnBack');
      const panelCity = document.getElementById('panelCity');
      const panelCityDesc = document.getElementById('panelCityDesc');
      const panelDays = document.getElementById('panelDays');
      let activePoint = null;

      if (typeof Globe === 'undefined') {
        container.innerHTML = '<div style="color:#fff;padding:24px;max-width:360px;line-height:1.6;">' +
          '<p style="color:#f88;margin-bottom:12px;">Globe 脚本未加载成功。</p>' +
          '<p>请先启动主后端，再用浏览器访问：</p>' +
          '<p style="margin:12px 0;"><strong>http://localhost:8000/mobile</strong></p>' +
          '<p style="font-size:12px;color:#888;">在项目根目录执行：<br>python main.py</p>' +
          '</div>';
        return;
      }

      container.innerHTML = '<p style="color:#ddd;padding:20px;">正在加载旅行坐标...</p>';

      const response = await fetch('/locations');
      if (!response.ok) {
        throw new Error('无法加载地点数据');
      }

      const locations = await response.json();
      const pointsData = (Array.isArray(locations) ? locations : []).map(item => ({
        key: [item.destination || '', item.country || '', item.city || ''].join('::'),
        city: item.city,
        country: item.country,
        destination: item.destination,
        lat: Number(item.lat),
        lng: Number(item.lng),
        count: item.count,
        latest_entry_date: item.latest_entry_date,
        altitude: 0.08,
        color: '#d87093'
      }));

      const pointIndex = new Map(pointsData.map(point => [point.key, point]));

      container.innerHTML = '';

      const globe = Globe()
        .globeImageUrl('/static/earth.jpg')
        .showAtmosphere(true)
        .atmosphereColor('lightskyblue')
        .atmosphereAltitude(0.15)
        .htmlElementsData(pointsData)
        .htmlLat(d => d.lat)
        .htmlLng(d => d.lng)
        .htmlAltitude(0.05)
        .htmlElement(d => {
          const el = document.createElement('div');
          el.style.cssText = 'display:flex;flex-direction:column;align-items:center;cursor:pointer;pointer-events:auto;user-select:none;-webkit-user-select:none;padding:8px;';
          el.innerHTML = '<span style="font-size:28px;line-height:1;pointer-events:none;">🚩</span>' +
            '<span style="font-size:11px;color:#ffb6c1;text-shadow:0 1px 3px #000;margin-top:2px;pointer-events:none;">' + d.city + '</span>';
          el.dataset.pointKey = d.key;
          el.addEventListener('click', function (e) {
            e.stopPropagation();
            goToCity(d);
          });
          return el;
        })
        (container);

      async function goToCity(point) {
        activePoint = point;
        const ctrl = globe.controls && globe.controls();
        if (ctrl) ctrl.autoRotate = false;
        globe.pointOfView({ lat: point.lat, lng: point.lng, altitude: 0.6 }, 1000);

        infoPanel.classList.add('open');
        backButton.classList.add('visible');
        panelCity.textContent = point.city;
        panelCityDesc.textContent = '正在加载这座城市的旅行记录...';
        panelDays.innerHTML = '';

        try {
          await showCityInfo(point);
        } catch (error) {
          console.error(error);
          panelCityDesc.textContent = '记录加载失败，请稍后再试。';
        }
      }

      async function showCityInfo(point) {
        const params = new URLSearchParams();
        if (point.destination) params.set('destination', point.destination);
        if (point.city) params.set('city', point.city);
        if (point.country) params.set('country', point.country);

        const entriesResponse = await fetch('/entries?' + params.toString());
        if (!entriesResponse.ok) {
          throw new Error('无法加载城市记录');
        }

        const entries = await entriesResponse.json();
        panelCity.textContent = point.city;
        panelCityDesc.textContent = buildSummary(point, entries);
        panelDays.innerHTML = '';

        if (!Array.isArray(entries) || entries.length === 0) {
          panelDays.innerHTML = '<div class="day-card"><div class="desc">这个地点还没有旅行记录。</div></div>';
          return;
        }

        entries.forEach(function (entry) {
          const card = document.createElement('div');
          card.className = 'day-card';
          const metaParts = [formatDate(entry.entry_date)];
          if (entry.entry_type) metaParts.push(entry.entry_type);
          if (entry.category) metaParts.push(entry.category);
          const title = entry.title ? '<strong>' + escapeHtml(entry.title) + '</strong><br>' : '';
          card.innerHTML = '<div class="date">' + metaParts.join(' · ') + '</div>' +
            '<div class="desc">' + title + escapeHtml(entry.content || '') + '</div>' +
            '<div class="card-actions">' +
            '  <button type="button" class="card-btn edit" data-entry-id="' + entry.id + '">编辑</button>' +
            '  <button type="button" class="card-btn delete" data-entry-id="' + entry.id + '">删除</button>' +
            '</div>';

          const editButton = card.querySelector('.edit');
          const deleteButton = card.querySelector('.delete');
          editButton.addEventListener('click', function () {
            editEntry(entry, point);
          });
          deleteButton.addEventListener('click', function () {
            deleteEntry(entry, point, deleteButton);
          });
          panelDays.appendChild(card);
        });
      }

      async function editEntry(entry, point) {
        const nextTitle = window.prompt('编辑标题', entry.title || '');
        if (nextTitle === null) return;

        const nextContent = window.prompt('编辑正文', entry.content || '');
        if (nextContent === null) return;

        const nextCategory = window.prompt('编辑分类', entry.category || '');
        if (nextCategory === null) return;

        try {
          const response = await fetch('/entries/' + entry.id, {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              title: nextTitle.trim() || null,
              content: nextContent,
              category: nextCategory.trim() || null
            })
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.detail || '更新失败');
          }

          await showCityInfo(point);
        } catch (error) {
          window.alert(error.message || '更新失败');
        }
      }

      async function deleteEntry(entry, point, button) {
        const ok = window.confirm('确认删除这条记录吗？这个操作无法撤销。');
        if (!ok) return;

        button.disabled = true;
        try {
          const response = await fetch('/entries/' + entry.id, {
            method: 'DELETE'
          });

          if (!response.ok) {
            const error = await response.json().catch(() => ({}));
            throw new Error(error.detail || '删除失败');
          }

          await refreshLocationsAndView(point);
        } catch (error) {
          button.disabled = false;
          window.alert(error.message || '删除失败');
        }
      }

      async function refreshLocationsAndView(point) {
        const response = await fetch('/locations');
        if (!response.ok) {
          throw new Error('无法刷新地点数据');
        }

        const locations = await response.json();
        const nextPoints = locations.map(item => ({
          key: [item.destination || '', item.country || '', item.city || ''].join('::'),
          city: item.city,
          country: item.country,
          destination: item.destination,
          lat: Number(item.lat),
          lng: Number(item.lng),
          count: item.count,
          latest_entry_date: item.latest_entry_date,
          altitude: 0.08,
          color: '#d87093'
        }));

        pointIndex.clear();
        nextPoints.forEach(function (item) {
          pointIndex.set(item.key, item);
        });
        globe.htmlElementsData(nextPoints);

        const nextPoint = pointIndex.get(point.key);
        if (nextPoint) {
          activePoint = nextPoint;
          await showCityInfo(nextPoint);
        } else {
          panelCity.textContent = point.city;
          panelCityDesc.textContent = '这个地点下已经没有记录了。';
          panelDays.innerHTML = '<div class="day-card"><div class="desc">你刚刚删除了这个地点下的最后一条记录。</div></div>';
        }
      }

      backButton.onclick = function () {
        activePoint = null;
        infoPanel.classList.remove('open');
        this.classList.remove('visible');
        const ctrl = globe.controls && globe.controls();
        if (ctrl) {
          ctrl.autoRotate = true;
          ctrl.autoRotateSpeed = 0.6;
        }
        globe.pointOfView({ lat: 0, lng: 0, altitude: 2.5 }, 1200);
      };

      globe.onGlobeReady(() => {
        const ctrl = globe.controls && globe.controls();
        if (ctrl) {
          ctrl.autoRotate = true;
          ctrl.autoRotateSpeed = 3;
          setTimeout(() => {
            if (globe.controls) globe.controls().autoRotateSpeed = 0.8;
          }, 2500);
        }
      });

      if (!pointsData.length) {
        panelCity.textContent = '还没有地点';
        panelCityDesc.textContent = '地球已经加载完成。去 /admin 添加一条带 city、lat、lng 的记录后，这里就会出现旗子。';
        panelDays.innerHTML = '<div class="day-card"><div class="desc">当前数据库里还没有可用于标点的地点数据。</div></div>';
      }

      let touchStartX = 0;
      let touchStartY = 0;
      let touchTarget = null;

      container.addEventListener('touchstart', function (e) {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchTarget = document.elementFromPoint(touchStartX, touchStartY);
        }
      }, { passive: true });

      container.addEventListener('touchend', function (e) {
        if (e.changedTouches.length === 1) {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          if (Math.sqrt(dx * dx + dy * dy) < 10 && touchTarget) {
            const flagEl = touchTarget.closest('[data-point-key]');
            if (flagEl) {
              const point = pointIndex.get(flagEl.dataset.pointKey);
              if (point) {
                goToCity(point);
              }
            }
          }
        }
        touchTarget = null;
      }, { passive: true });

      globe.pointOfView({ lat: 35, lng: 118, altitude: 2.2 });
    }

    function buildSummary(point, entries) {
      const pieces = [];
      if (point.destination) pieces.push(point.destination);
      if (point.country && point.country !== point.city) pieces.push(point.country);
      pieces.push(point.city);

      const header = pieces.filter(Boolean).join(' · ');
      const countText = Array.isArray(entries) ? '共 ' + entries.length + ' 条记录' : '';
      return [header, countText].filter(Boolean).join(' · ');
    }

    function formatDate(value) {
      if (!value) return '未填写日期';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return value;
      }
      return date.getFullYear() + '年' + (date.getMonth() + 1) + '月' + date.getDate() + '日';
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
