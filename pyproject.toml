[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chat-app"
version = "0.1.0"
description = "Decoupled AI chat application with FastAPI, Gradio, ready for crewai and ragflow"
authors = []
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.95.0",
    "uvicorn>=0.22.0",
    "pydantic>=1.10.0",
    "PyMySQL>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
